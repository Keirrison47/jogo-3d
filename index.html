<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Runner 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #050510;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      user-select: none;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ffcc;
      z-index: 10;
    }
    #game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(5, 5, 16, 0.92);
      padding: 40px;
      border-radius: 12px;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
      z-index: 20;
    }
    #game-over h1 {
      color: #ff4757;
      margin-bottom: 10px;
    }
    #restart-btn {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #050510;
      background-color: #00ffcc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #restart-btn:hover {
      background-color: #00d9ad;
    }
    #instructions {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 15px;
      color: #cccccc;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="ui">Pontuação: <span id="score">0</span></div>

  <div id="game-over">
    <h1>FIM DE JOGO</h1>
    <p>Pontuação final: <span id="final-score">0</span></p>
    <button id="restart-btn">Jogar Novamente</button>
  </div>

  <div id="instructions">Use as setas ⬅️ e ➡️ (ou A e D) para desviar</div>

  <!-- Importação moderna e oficial do Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // 1. Configuração da Cena e Câmera
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050510, 0.03);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.5, 7);
    camera.lookAt(0, 0, -5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 3. Chão em Grade
    const gridHelper = new THREE.GridHelper(120, 60, 0x00ffcc, 0x1a1a40);
    gridHelper.position.y = -0.5;
    scene.add(gridHelper);

    // 4. Nave do Jogador
    const playerGeometry = new THREE.ConeGeometry(0.6, 1.8, 4);
    const playerMaterial = new THREE.MeshStandardMaterial({
      color: 0x00ffcc,
      emissive: 0x005544,
      roughness: 0.3
    });
    const player = new THREE.Mesh(playerGeometry, playerMaterial);
    player.rotation.x = -Math.PI / 2;
    player.position.y = 0.2;
    scene.add(player);

    // 5. Variáveis de Controle
    let obstacles = [];
    let score = 0;
    let speed = 0.35;
    let isGameOver = false;
    let targetX = 0;
    let frameCount = 0;
    const laneLimit = 5.5;

    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const gameOverEl = document.getElementById('game-over');
    const restartBtn = document.getElementById('restart-btn');

    // 6. Controles e Eventos
    window.addEventListener('keydown', (e) => {
      if (isGameOver) return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        targetX = Math.max(targetX - 1.8, -laneLimit);
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        targetX = Math.min(targetX + 1.8, laneLimit);
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    restartBtn.addEventListener('click', resetGame);

    // 7. Geração de Obstáculos
    function spawnObstacle() {
      const size = Math.random() * 0.7 + 0.7;
      const geometry = new THREE.DodecahedronGeometry(size);
      const material = new THREE.MeshStandardMaterial({
        color: 0xff4757,
        roughness: 0.6
      });
      const obstacle = new THREE.Mesh(geometry, material);

      obstacle.position.x = (Math.random() - 0.5) * (laneLimit * 2.2);
      obstacle.position.y = 0.3;
      obstacle.position.z = -55;

      scene.add(obstacle);
      obstacles.push(obstacle);
    }

    // 8. Reiniciar Partida
    function resetGame() {
      obstacles.forEach(obs => scene.remove(obs));
      obstacles = [];
      score = 0;
      speed = 0.35;
      targetX = 0;
      frameCount = 0;
      player.position.x = 0;
      isGameOver = false;

      scoreEl.innerText = '0';
      gameOverEl.style.display = 'none';
      animate();
    }

    // 9. Loop Principal
    function animate() {
      if (isGameOver) return;
      requestAnimationFrame(animate);

      frameCount++;

      // Movimento suave da nave
      player.position.x += (targetX - player.position.x) * 0.15;
      player.rotation.z = (player.position.x - targetX) * 0.5;

      // Movimento do chão
      gridHelper.position.z += speed;
      if (gridHelper.position.z > 2) {
        gridHelper.position.z = 0;
      }

      // Frequência de obstáculos
      const spawnRate = Math.max(15, 45 - Math.floor(score / 100));
      if (frameCount % spawnRate === 0) {
        spawnObstacle();
      }

      // Caixa de colisão do jogador
      const playerBox = new THREE.Box3().setFromObject(player);
      playerBox.expandByScalar(-0.2);

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.position.z += speed;
        obs.rotation.x += 0.03;
        obs.rotation.y += 0.03;

        const obsBox = new THREE.Box3().setFromObject(obs);

        if (playerBox.intersectsBox(obsBox)) {
          isGameOver = true;
          finalScoreEl.innerText = Math.floor(score);
          gameOverEl.style.display = 'block';
          return;
        }

        if (obs.position.z > 10) {
          scene.remove(obs);
          obstacles.splice(i, 1);
        }
      }

      score += 0.5;
      speed += 0.0001;
      scoreEl.innerText = Math.floor(score);

      renderer.render(scene, camera);
    }

    // Inicia o jogo
    animate();
  </script>
</body>
</html>
